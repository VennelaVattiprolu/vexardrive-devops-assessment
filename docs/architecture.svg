<svg width="1000" height="760" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- Legend -->
  <text x="40" y="24" font-size="16" font-weight="bold" fill="#1a1a1a">VexarDrive Fleet Ping Service — Azure Architecture</text>

  <!-- External: Fleet vehicles -->
  <rect x="40" y="50" width="230" height="50" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="155" y="72" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c2c2a">Fleet vehicles / driver apps</text>
  <text x="155" y="88" font-size="11" text-anchor="middle" fill="#5f5e5a">Public internet clients</text>

  <!-- External: GitHub Actions -->
  <rect x="730" y="50" width="230" height="50" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="845" y="72" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c2c2a">GitHub Actions (CI/CD)</text>
  <text x="845" y="88" font-size="11" text-anchor="middle" fill="#5f5e5a">test, build, scan, deploy</text>

  <!-- Azure RG outer container -->
  <rect x="40" y="130" width="920" height="590" rx="14" fill="#ffffff" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="155" font-size="13" font-weight="bold" fill="#185FA5">Azure Resource Group (per environment, e.g. vexar-prod-rg)</text>

  <!-- VNet container -->
  <rect x="70" y="175" width="560" height="230" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="88" y="198" font-size="12" font-weight="bold" fill="#3B6D11">Virtual Network (10.0.0.0/16)</text>

  <!-- Container Apps subnet/box -->
  <rect x="90" y="215" width="250" height="185" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="215" y="240" font-size="13" font-weight="bold" text-anchor="middle" fill="#0C447C">Container Apps Environment</text>
  <text x="215" y="258" font-size="11" text-anchor="middle" fill="#185FA5">vexar-fleet-ping API</text>
  <text x="215" y="274" font-size="11" text-anchor="middle" fill="#185FA5">Public ingress (HTTPS :443)</text>
  <text x="215" y="290" font-size="11" text-anchor="middle" fill="#185FA5">Multiple revision mode</text>
  <text x="215" y="306" font-size="11" text-anchor="middle" fill="#185FA5">min 1-2 / max 3-10 replicas</text>
  <text x="215" y="322" font-size="11" text-anchor="middle" fill="#185FA5">/healthz /readyz probes</text>
  <text x="215" y="338" font-size="10" font-style="italic" text-anchor="middle" fill="#378ADD">Uses managed identity for Key Vault + ACR access</text>

  <!-- Postgres subnet/box -->
  <rect x="370" y="215" width="230" height="165" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
  <text x="485" y="240" font-size="13" font-weight="bold" text-anchor="middle" fill="#27500A">PostgreSQL Flexible Server</text>
  <text x="485" y="258" font-size="11" text-anchor="middle" fill="#3B6D11">Private access only</text>
  <text x="485" y="274" font-size="11" text-anchor="middle" fill="#3B6D11">No public IP</text>
  <text x="485" y="290" font-size="11" text-anchor="middle" fill="#3B6D11">Delegated subnet + private DNS</text>
  <text x="485" y="306" font-size="11" text-anchor="middle" fill="#3B6D11">Automated backups + PITR</text>
  <text x="485" y="322" font-size="11" text-anchor="middle" fill="#3B6D11">HA (prod only)</text>

  <!-- ACR -->
  <rect x="660" y="175" width="270" height="70" rx="8" fill="#F5EAF5" stroke="#7F77DD" stroke-width="1"/>
  <text x="795" y="200" font-size="13" font-weight="bold" text-anchor="middle" fill="#26215C">Container Registry (ACR)</text>
  <text x="795" y="218" font-size="11" text-anchor="middle" fill="#3C3489">Identity-based pull/push only</text>
  <text x="795" y="233" font-size="11" text-anchor="middle" fill="#3C3489">Admin credentials disabled</text>

  <!-- Key Vault -->
  <rect x="660" y="260" width="270" height="70" rx="8" fill="#F5EAF5" stroke="#7F77DD" stroke-width="1"/>
  <text x="795" y="285" font-size="13" font-weight="bold" text-anchor="middle" fill="#26215C">Key Vault (RBAC)</text>
  <text x="795" y="303" font-size="11" text-anchor="middle" fill="#3C3489">DB password, JWT secret</text>
  <text x="795" y="318" font-size="11" text-anchor="middle" fill="#3C3489">Secrets User role only</text>

  <!-- Managed identities -->
  <rect x="660" y="345" width="270" height="60" rx="8" fill="#F5EAF5" stroke="#7F77DD" stroke-width="1"/>
  <text x="795" y="368" font-size="13" font-weight="bold" text-anchor="middle" fill="#26215C">Managed Identities</text>
  <text x="795" y="386" font-size="11" text-anchor="middle" fill="#3C3489">App identity + separate CI/CD identity</text>

  <!-- Log Analytics -->
  <rect x="70" y="430" width="860" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="500" y="455" font-size="13" font-weight="bold" text-anchor="middle" fill="#633806">Log Analytics Workspace</text>
  <text x="500" y="473" font-size="11" text-anchor="middle" fill="#854F0B">Structured app logs, platform metrics, 6 alerts (error rate, readiness, restarts, DB CPU/connections, auth abuse)</text>
  <text x="500" y="489" font-size="11" text-anchor="middle" fill="#854F0B">Action group -&gt; email on-call</text>

  <!-- Notes box -->
  <rect x="70" y="520" width="860" height="180" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="1"/>
  <text x="88" y="545" font-size="12" font-weight="bold" fill="#2c2c2a">Network boundary summary</text>
  <text x="88" y="566" font-size="11" fill="#444441">- Public: Container Apps ingress (must be reachable by fleet vehicles/drivers), ACR + Key Vault management endpoints (access gated by Azure AD RBAC, not network isolation)</text>
  <text x="88" y="584" font-size="11" fill="#444441">- Private: PostgreSQL - no public IP, reachable only from inside the VNet via a delegated subnet. The single highest-value network control in this design.</text>
  <text x="88" y="602" font-size="11" fill="#444441">- Identity: two separate user-assigned managed identities (app runtime vs CI/CD) - neither has Contributor on the resource group, each scoped to only what it needs</text>
  <text x="88" y="620" font-size="11" fill="#444441">- No stored credentials anywhere: DB password and JWT secret generated by Terraform straight into Key Vault; CI/CD uses GitHub OIDC federation, not a stored Azure credential</text>
  <text x="88" y="644" font-size="12" font-weight="bold" fill="#2c2c2a">Compute choice</text>
  <text x="88" y="663" font-size="11" fill="#444441">Azure Container Apps (not AKS) - single service, small team, no dedicated platform/SRE function. See docs/REPORT.md, Deliverable 3, for the full reasoning and trade-offs.</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Fleet vehicles -> Container Apps -->
  <path d="M155 100 L155 160 L215 160 L215 213" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="185" font-size="10" fill="#5f5e5a">HTTPS (public)</text>

  <!-- GitHub Actions -> ACR -->
  <path d="M845 100 L845 130 L795 130 L795 173" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="850" y="145" font-size="10" fill="#5f5e5a">Push image (OIDC)</text>

  <!-- GitHub Actions -> Container Apps (deploy) -->
  <path d="M845 100 L845 118 L340 118 L340 213" fill="none" stroke="#5f5e5a" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="350" y="112" font-size="10" fill="#5f5e5a">Deploy new revision (OIDC)</text>

  <!-- Container Apps -> Postgres -->
  <path d="M340 297 L370 297" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="345" y="290" font-size="10" fill="#5f5e5a">Private, SSL</text>

  <!-- Container Apps + Postgres -> Log Analytics -->
  <path d="M215 380 L215 428" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M485 380 L485 428" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="418" font-size="10" fill="#5f5e5a">Logs</text>
  <text x="495" y="418" font-size="10" fill="#5f5e5a">Metrics</text>
</svg>
